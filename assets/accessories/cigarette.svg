    <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;0.2 -1.2;-0.3 -2.4;0.5 -3.6;0 -4.8;0.7 -6" dur="2.7s" begin="-0.2s" repeatCount="indefinite"/>
  </rect>
