<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* one-shot 15s bender: drink, smoke, sway, pass out */
      .bd-master {
        transform-origin: 12px 15px;
        animation: bd-topple 15s 1 ease-in-out forwards;
      }
      .bd-sway {
        transform-origin: 7.5px 13px;
        animation: bd-sway 15s 1 ease-in-out forwards;
      }
      .bd-eyes {
        transform-origin: 7.5px 9px;
        animation: bd-droop 15s 1 ease-in-out forwards;
      }
      .bd-bottle {
        transform-origin: 15.5px 12px;
        animation: bd-swig 15s 1 ease-in-out forwards;
      }
      .bd-shadow { transform-origin: 7.5px 15.5px; animation: bd-shadow 15s 1 ease-in-out forwards; }
      .bd-ember { animation: bd-ember 1.6s infinite ease-in-out; }
      .bd-smoke { opacity: 0; }
      .bd-s1 { animation: bd-rise 3s infinite linear; }
      .bd-s2 { animation: bd-rise 3s infinite linear; animation-delay: 1.5s; }
      .bd-z { opacity: 0; }
      .bd-z1 { animation: bd-float 3.5s infinite ease-in-out; animation-delay: 11.5s; }
      .bd-z2 { animation: bd-float 3.5s infinite ease-in-out; animation-delay: 12.7s; }
      .bd-z3 { animation: bd-float 3.5s infinite ease-in-out; animation-delay: 13.9s; }

      @keyframes bd-swig {
        0%, 8%   { transform: rotate(0deg) translate(0, 0); }
        14%, 22% { transform: rotate(-70deg) translate(-1px, -2px); }  /* swig 1 */
        28%, 34% { transform: rotate(0deg) translate(0, 0); }
        40%, 50% { transform: rotate(-75deg) translate(-1px, -2.5px); } /* swig 2, longer */
        56%      { transform: rotate(0deg) translate(0, 0); }
        70%      { transform: rotate(0deg) translate(0, 0); }
        78%, 100%{ transform: rotate(100deg) translate(2px, 3px); }     /* bottle hits the floor */
      }
      @keyframes bd-sway {
        0%, 30%  { transform: rotate(0deg); }
        38%      { transform: rotate(-2.5deg); }
        46%      { transform: rotate(2.5deg); }
        54%      { transform: rotate(-4deg); }
        62%      { transform: rotate(4deg); }
        68%      { transform: rotate(-5deg); }
        72%, 100%{ transform: rotate(0deg); }
      }
      @keyframes bd-topple {
        0%, 72%  { transform: rotate(0deg); }
        76%      { transform: rotate(20deg); }
        80%, 100%{ transform: rotate(88deg); }   /* face-plant to the right */
      }
      @keyframes bd-droop {
        0%, 35%  { transform: scaleY(1); }
        55%      { transform: scaleY(0.55); }
        75%, 100%{ transform: scaleY(0.12); }
      }
      @keyframes bd-shadow {
        0%, 72%  { transform: scaleX(1); opacity: 0.5; }
        80%, 100%{ transform: scaleX(1.5); opacity: 0.4; }
      }
      @keyframes bd-ember { 0%, 100% { fill: #E03A00; opacity: .85; } 50% { fill: #FF7A1A; opacity: 1; } }
      @keyframes bd-rise {
        0%   { transform: translate(0, 1.5px); opacity: 0; }
        25%  { opacity: .8; }
        100% { transform: translate(1px, -4px); opacity: 0; }
      }
      @keyframes bd-float {
        0%   { transform: translate(0, 0) scale(.5); opacity: 0; }
        15%  { opacity: 1; }
        100% { transform: translate(4px, -9px) scale(1.1); opacity: 0; }
      }
    </style>
  </defs>

  <g class="bd-shadow">
    <rect x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>
  </g>

  <g class="bd-master">
    <!-- legs -->
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/>
      <rect x="11" y="13" width="1" height="2"/>
    </g>

    <g class="bd-sway">
      <!-- body -->
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>

      <!-- cowboy hat -->
      <g class="od-hat">
        <rect x="-1" y="4" width="1" height="1" fill="#A5682A"/>
        <rect x="15" y="4" width="1" height="1" fill="#A5682A"/>
        <rect x="0" y="5" width="15" height="1" fill="#A5682A"/>
        <rect x="3" y="2" width="9" height="3" fill="#A5682A"/>
        <rect x="3" y="1" width="3" height="1" fill="#A5682A"/>
        <rect x="9" y="1" width="3" height="1" fill="#A5682A"/>
        <rect x="3" y="4" width="9" height="1" fill="#6B3E1D"/>
      </g>

      <!-- eyes (droop as the night goes on) -->
      <g class="bd-eyes" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>

      <!-- cigarette -->
      <g class="od-cig">
        <rect x="12" y="11" width="3" height="1" fill="#EDEDE3"/>
        <rect x="15" y="11" width="1" height="1" fill="#FF5A00" class="bd-ember"/>
        <rect x="14" y="9.4" width="0.8" height="0.8" fill="#9E9E9E" class="bd-smoke bd-s1"/>
        <rect x="14.2" y="7.4" width="0.7" height="0.7" fill="#B0B0B0" class="bd-smoke bd-s2"/>
      </g>

      <!-- bottle in the right claw -->
      <g class="bd-bottle">
        <rect x="15" y="8" width="2" height="4" fill="#B06A28"/>
        <rect x="15.5" y="6.5" width="1" height="1.5" fill="#B06A28"/>
        <rect x="15.5" y="8.4" width="1" height="1" fill="#E8C87A"/>
      </g>
    </g>
  </g>

  <!-- Zzz after the face-plant -->
  <g fill="#9AB8D8">
    <rect class="bd-z bd-z1" x="14" y="10" width="1.6" height="1.6"/>
    <rect class="bd-z bd-z2" x="15" y="9"  width="1.2" height="1.2"/>
    <rect class="bd-z bd-z3" x="13" y="9"  width="0.9" height="0.9"/>
  </g>
</svg>
