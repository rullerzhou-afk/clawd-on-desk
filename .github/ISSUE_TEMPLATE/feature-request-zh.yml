name: "🎁 功能建议（中文）"
description: "为 Clawd on Desk 提议新功能或改进"
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提交功能建议前，请先搜索现有 Issue；如果已经有相同需求，请优先为现有 Issue 添加 👍。

  - type: textarea
    id: problem
    attributes:
      label: "问题或使用场景"
      description: "请描述你希望解决的用户问题、限制或工作流痛点。"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "期望行为"
      description: "请描述希望实现的行为或结果。尽量说明使用契约，而不是限定某一种具体实现。"
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: "涉及范围"
      description: "可选：Settings、Dashboard、权限、某个 Agent 集成、主题、更新器等。"
      placeholder: "Settings / Codex 集成 / updater"

  - type: textarea
    id: alternatives
    attributes:
      label: "现有替代方案或 workaround"
      description: "你目前如何处理这个需求？现有方式为什么不够好？"

  - type: textarea
    id: scope
    attributes:
      label: "其他上下文或范围边界"
      description: "可补充兼容性约束、非目标、示例或截图。"

  - type: checkboxes
    id: checks
    attributes:
      label: "提交前确认"
      options:
        - label: "我已经搜索过现有 Issue，没有发现相同或高度相似的需求。"
          required: true
