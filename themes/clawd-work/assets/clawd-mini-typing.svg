<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Clawd Work: generated by tools/generate-clawd-work-theme.js -->
  <defs><pattern id="clawd-work-suit" patternUnits="userSpaceOnUse" x="-60" y="-60" width="140" height="140"><g transform="translate(60 60)" shape-rendering="crispEdges"><rect x="-60" y="-60" width="140" height="140" fill="#DE886D"/><rect x="-60" y="8.5" width="62" height="60" fill="#2B2F3A"/><rect x="13" y="8.5" width="60" height="60" fill="#2B2F3A"/><rect x="-60" y="11" width="140" height="60" fill="#2B2F3A"/><rect x="5" y="11" width="1" height="1" fill="#3A4050"/><rect x="9" y="11" width="1" height="1" fill="#3A4050"/><rect x="6" y="11" width="3" height="1" fill="#F4F4F0"/><rect x="7" y="11" width="1" height="2" fill="#C8323C"/><rect x="3.5" y="7.5" width="2" height="2.75" fill="#FFFFFF" fill-opacity="0.18"/><rect x="9.5" y="7.5" width="2" height="2.75" fill="#FFFFFF" fill-opacity="0.18"/><path d="M3 7h3v3.75h-3zM3.5 7.5v2.75h2v-2.75z" fill="#15151A" fill-rule="evenodd"/><path d="M9 7h3v3.75h-3zM9.5 7.5v2.75h2v-2.75z" fill="#15151A" fill-rule="evenodd"/><rect x="6" y="7.75" width="3" height="0.5" fill="#15151A"/><rect x="2" y="7.75" width="1" height="0.5" fill="#15151A"/><rect x="12" y="7.75" width="1" height="0.5" fill="#15151A"/></g></pattern></defs>
  <defs>
    <style>
      .breathe-anim {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }

      .eyes-read {
        animation: read-code 1.2s infinite;
      }

      #eyes-js {
        transition: transform 0.2s ease-out;
      }

      .arm-l-type {
        transform-origin: 3px 10px;
        animation: type-l 0.15s infinite ease-in-out;
      }
      .arm-r-type {
        transform-origin: 12px 10px;
        animation: type-r 0.12s infinite ease-in-out;
      }

      /* Floating data packets */
      .data-bit {
        opacity: 0;
        animation: float-data 1s infinite linear;
      }
      .d1 { animation-delay: 0.0s; transform-origin: -2px 10px; }
      .d2 { animation-delay: 0.3s; transform-origin: 5px 12px; }
      .d3 { animation-delay: 0.6s; transform-origin: 12px 11px; }
      .d4 { animation-delay: 0.8s; transform-origin: 17px 9px; }
      .d5 { animation-delay: 0.1s; transform-origin: 8px 10px; }
      .d6 { animation-delay: 0.4s; transform-origin: 0px 11px; }
      .d7 { animation-delay: 0.7s; transform-origin: 15px 12px; }

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      @keyframes read-code {
        0%, 14%   { transform: translate(-2px, 0); }
        15%, 29%  { transform: translate(-1.5px, 0); }
        30%, 44%  { transform: translate(-1px, 0); }
        45%, 59%  { transform: translate(-0.5px, 0); }
        60%, 84%  { transform: translate(0px, 0); }
        85%, 100% { transform: translate(-2px, 0); }
      }

      @keyframes type-l {
        0%   { transform: rotate(-10deg); }
        25%  { transform: rotate(15deg); }
        50%  { transform: rotate(-5deg); }
        75%  { transform: rotate(10deg); }
        100% { transform: rotate(-10deg); }
      }

      @keyframes type-r {
        0%   { transform: rotate(10deg); }
        25%  { transform: rotate(-15deg); }
        50%  { transform: rotate(5deg); }
        75%  { transform: rotate(-10deg); }
        100% { transform: rotate(10deg); }
      }

      .logo-glow {
        animation: logo-pulse 1.5s infinite alternate ease-in-out;
      }

      @keyframes logo-pulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }

      /* Packets float up and fade */
      @keyframes float-data {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 0.8; }
        100% { transform: translateY(-15px) scale(1.2); opacity: 0; }
      }
    </style>
  </defs>

  <!-- No shadow (against screen edge, no ground plane) -->

  <!-- Entire character leaning: rotate -12° around feet base (7.5, 15) -->
  <!-- Negative = counterclockwise = head tilts left toward screen = peeking pose -->
  <g transform="rotate(-12, 7.5, 15)">

    <!-- Legs (inside rotation group so they tilt with the body) -->
    <g fill="url(#clawd-work-suit)">
      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>
      <rect x="9" y="11" width="1" height="4"/>
      <rect x="11" y="11" width="1" height="4"/>
    </g>

    <!-- Upper Body (JS body-shift preserved for compatibility) -->
    <g id="body-js">
      <g id="accessory-anchor" class="breathe-anim">
        <!-- Torso -->
        <rect x="2" y="6" width="11" height="7" fill="url(#clawd-work-suit)"/>

        <!-- Left Arm — typing -->
        <g class="arm-l-type">
          <rect x="0" y="9" width="3" height="2" fill="url(#clawd-work-suit)"/>
        </g>

        <!-- Right Arm — typing -->
        <g class="arm-r-type">
          <rect x="12" y="9" width="3" height="2" fill="url(#clawd-work-suit)"/>
        </g>

        <!-- Eyes: JS translate wrapper + CSS blink -->
        <g id="eyes-js" fill="#000000">
          <g class="eyes-read">
            <rect x="4" y="8" width="1" height="2"/>
            <rect x="10" y="8" width="1" height="2"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Pixel Laptop (inside rotation group so it leans with Clawd) -->
    <g id="laptop" transform="translate(3, 11)">
      <!-- Laptop Base --> 
      <rect x="-0.5" y="4" width="8" height="1" fill="#546E7A" rx="0.5"/>
      <!-- Screen Back -->
      <rect x="0" y="0" width="7" height="4.5" fill="#78909C" rx="0.5"/>
      <!-- Glowing Logo -->
      <circle cx="3.5" cy="2" r="1.2" fill="#40C4FF" opacity="0.2" class="logo-glow"/>
      <rect x="3" y="1.5" width="1" height="1" fill="#FFFFFF" class="logo-glow"/>
    </g>
  </g>
  <!-- Data Particles floating up from behind the laptop -->
  <g class="data-particles" fill="#40C4FF">
    <g class="data-bit d1"><g transform="translate(-2,12)"><rect x="0" y="0" width="1.5" height="1.5"/></g></g>
    <g class="data-bit d2"><g transform="translate(5,11)"><rect x="0" y="0" width="1.5" height="1.5"/></g></g>
    <g class="data-bit d3"><g transform="translate(12,13)"><rect x="0" y="0" width="1.5" height="1.5"/></g></g>
    <g class="data-bit d4"><g transform="translate(17,11)"><rect x="0" y="0" width="1.5" height="1.5"/></g></g>
    <g class="data-bit d5"><g transform="translate(8,10)"><rect x="0" y="0" width="1.5" height="1.5"/></g></g>
    <g class="data-bit d6"><g transform="translate(1,11)"><rect x="0" y="0" width="1.5" height="1.5"/></g></g>
    <g class="data-bit d7"><g transform="translate(15,12)"><rect x="0" y="0" width="1.5" height="1.5"/></g></g>
  </g>
</svg>
