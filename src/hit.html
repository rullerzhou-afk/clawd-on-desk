<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: rgba(0,0,0,0.004); }
    #hit-area { width: 100%; height: 100%; cursor: grab; }
    #hit-area.dragging { cursor: grabbing; }
    /* Peteleco: aiming is not dragging — the pet stays put while the cursor
       pulls the shot back, so the grab cursor would be a lie. */
    #hit-area.aiming { cursor: crosshair; }
  </style>
</head>
<body>
  <div id="hit-area"></div>
  <script src="hit-renderer.js"></script>
</body>
</html>
